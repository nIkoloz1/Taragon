<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thank you — Ta[RAG]on</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{--paper:#F6F1E6;--ink:#17150F;--ink-soft:#4B463B;--green:#2E5A38}
  *{margin:0;box-sizing:border-box}
  body{font-family:"Inter",system-ui,sans-serif;background:var(--paper);color:var(--ink);
    min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
  .card{max-width:460px}
  .check{width:64px;height:64px;border-radius:50%;background:var(--green);display:grid;place-items:center;margin:0 auto 26px;
    box-shadow:0 16px 30px -14px var(--green)}
  .check svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  h1{font-family:"Fraunces",serif;font-size:34px;font-weight:600;letter-spacing:-.01em;margin-bottom:12px}
  p{color:var(--ink-soft);font-size:17px;line-height:1.6;margin-bottom:28px}
  a.btn{display:inline-block;background:var(--ink);color:var(--paper);text-decoration:none;
    font-weight:550;padding:13px 24px;border-radius:999px;transition:transform .15s}
  a.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
  <div class="card">
    <div class="check"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>
    <h1>Got it — thank you.</h1>
    <p>Your submission is safely in. We'll take a look and be in touch shortly.</p>
    <a class="btn" href="/">← Back to Taragon</a>
  </div>
</body>
</html>
