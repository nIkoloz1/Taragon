# Netlify build config — this is a plain static site, no build step.
[build]
  publish = "."

# Nice security headers (optional, harmless)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
